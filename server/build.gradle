plugins {
	id 'fabric-loom'
	id 'ploceus'
}

base {
	archivesName = "${project.archives_base_name}-server"
}
version = "${project.version}+mc${project.server_minecraft_version}"
group = project.maven_group

dependencies {
	minecraft "com.mojang:minecraft:${project.server_minecraft_version}"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// raven/sparrow/nests and OSL are not published for a0.2.8
	mappings ploceus.featherMappings(project.server_feather_build)
}

processResources {
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 8
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${base.archivesName.get()}" }
	}
}
